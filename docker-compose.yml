services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: byak
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: byak
    ports: ["5432:5432"]
    volumes: ["byak-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byak"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["byak-redis:/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me-now
    ports: ["9000:9000", "9001:9001"]
    volumes: ["byak-objects:/data"]
volumes:
  byak-postgres:
  byak-redis:
  byak-objects:

