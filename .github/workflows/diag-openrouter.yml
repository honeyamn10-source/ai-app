name: Diagnose OpenRouter
on:
  push:
    branches: [diag/openrouter-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Pollinations without a key
        run: |
          set +e
          echo "== text.pollinations.ai/models";   curl -sS -m 30 -w '\nHTTP %{http_code}\n' https://text.pollinations.ai/models | head -c 1500; echo
          echo "== gen.pollinations.ai/v1/models"; curl -sS -m 30 -w '\nHTTP %{http_code}\n' https://gen.pollinations.ai/v1/models | head -c 1500; echo
          for url in https://text.pollinations.ai/openai https://gen.pollinations.ai/v1/chat/completions; do
            for model in openai openai-fast mistral; do
              echo "== POST $url model=$model (stream)"
              curl -sS -m 60 -w '\nHTTP %{http_code}\n' -H 'Content-Type: application/json' -H 'Referer: https://honeyamn10-source.github.io/' \
                -d "{\"model\":\"$model\",\"stream\":true,\"messages\":[{\"role\":\"system\",\"content\":\"Be brief.\"},{\"role\":\"user\",\"content\":\"Say hello in 3 words\"}]}" "$url" | head -c 1200; echo
            done
          done
          echo "== GET text.pollinations.ai/{prompt}"; curl -sS -m 60 -w '\nHTTP %{http_code}\n' "https://text.pollinations.ai/Say%20hello%20in%203%20words" | head -c 600; echo
          echo "== GET gen.pollinations.ai/text/{prompt}"; curl -sS -m 60 -w '\nHTTP %{http_code}\n' "https://gen.pollinations.ai/text/Say%20hello%20in%203%20words" | head -c 600; echo
          sleep 16
          echo "== second request 16s later (rate limit)"; curl -sS -m 60 -w '\nHTTP %{http_code}\n' -H 'Content-Type: application/json' -d '{"model":"openai","messages":[{"role":"user","content":"Say bye in 2 words"}]}' https://text.pollinations.ai/openai | head -c 800; echo
