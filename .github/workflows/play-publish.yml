name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track. 'internal' ignores rollout_fraction."
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      rollout_fraction:
        description: "Staged rollout fraction for alpha/beta/production, 0 < f <= 1 (0.1 = 10%)."
        type: string
        default: "0.1"
      changes:
        description: "Release notes (internal testing notes only; production notes come from the store listing)."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: play-publish-${{ inputs.track }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate config and build signed AAB
    runs-on: ubuntu-latest
    outputs:
      aab_path: ${{ steps.build.outputs.aab_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check that the required release secrets are configured
        env:
          BYAK_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BYAK_UPLOAD_KEYSTORE_BASE64 }}
          BYAK_KEYSTORE_PASSWORD: ${{ secrets.BYAK_KEYSTORE_PASSWORD }}
          BYAK_KEY_ALIAS: ${{ secrets.BYAK_KEY_ALIAS }}
          BYAK_KEY_PASSWORD: ${{ secrets.BYAK_KEY_PASSWORD }}
          BYAK_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.BYAK_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [ -z "${!1:-}" ]; then echo "::error::secret $1 is not set."; missing=1; fi
          }
          check BYAK_UPLOAD_KEYSTORE_BASE64
          check BYAK_KEYSTORE_PASSWORD
          check BYAK_KEY_ALIAS
          check BYAK_KEY_PASSWORD
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the missing secrets under Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi
          # The service account is only needed for the upload step; warn early but do not block the build.
          if [ -z "${BYAK_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning::BYAK_PLAY_SERVICE_ACCOUNT_JSON is not set. The bundle will be built but the upload step will fail."
          fi

      - name: Decode upload keystore from secret
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.BYAK_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/byak"
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r' | base64 --decode > "$RUNNER_TEMP/byak/upload.jks"
          chmod 600 "$RUNNER_TEMP/byak/upload.jks"
          echo "BYAK_KEYSTORE_FILE=$RUNNER_TEMP/byak/upload.jks" >> "$GITHUB_ENV"
          echo "decoded upload.jks"

      - name: Validate release signing
        env:
          BYAK_KEYSTORE_PASSWORD: ${{ secrets.BYAK_KEYSTORE_PASSWORD }}
          BYAK_KEY_ALIAS: ${{ secrets.BYAK_KEY_ALIAS }}
          BYAK_KEY_PASSWORD: ${{ secrets.BYAK_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.BYAK_UPLOAD_CERT_SHA256 }}
        run: ./scripts/validate-release-signing.sh

      - name: Build release bundle
        id: build
        env:
          BYAK_KEYSTORE_PASSWORD: ${{ secrets.BYAK_KEYSTORE_PASSWORD }}
          BYAK_KEY_ALIAS: ${{ secrets.BYAK_KEY_ALIAS }}
          BYAK_KEY_PASSWORD: ${{ secrets.BYAK_KEY_PASSWORD }}
          BYAK_GOOGLE_WEB_CLIENT_ID: ${{ vars.BYAK_GOOGLE_WEB_CLIENT_ID }}
          BYAK_SUPPORT_EMAIL: ${{ vars.BYAK_SUPPORT_EMAIL }}
          BYAK_PRIVACY_POLICY_URL: ${{ vars.BYAK_PRIVACY_POLICY_URL }}
          BYAK_TERMS_URL: ${{ vars.BYAK_TERMS_URL }}
        run: |
          set -euo pipefail
          gradle -p android --no-daemon clean bundleRelease releaseVersionInfo
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::$AAB was not produced."; exit 1; }
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"
          ls -l "$AAB"

      - name: Refuse to upload a versionCode Play has already used
        env:
          MIN_VERSION_CODE: ${{ vars.BYAK_MIN_VERSION_CODE }}
        run: |
          set -euo pipefail
          INFO=android/app/build/release-version-info.txt
          test -f "$INFO" || { echo "::error::release-version-info.txt was not produced."; exit 1; }
          cat "$INFO"
          CODE="$(sed -n 's/^versionCode=//p' "$INFO")"
          APPID="$(sed -n 's/^applicationId=//p' "$INFO")"
          if [ "$APPID" != "ai.byak.app" ]; then
            echo "::error::applicationId is '$APPID' but this workflow publishes ai.byak.app."
            exit 1
          fi
          if [ -z "${MIN_VERSION_CODE:-}" ]; then
            echo "::warning::BYAK_MIN_VERSION_CODE is not set; skipping the versionCode floor check."
            exit 0
          fi
          if [ "$CODE" -le "$MIN_VERSION_CODE" ]; then
            echo "::error::versionCode $CODE is not higher than BYAK_MIN_VERSION_CODE ($MIN_VERSION_CODE)."
            echo "::error::Google Play rejects a reused or lower versionCode. The release branches in this repo are not on one monotonic version line, so check which branch you are building from, bump versionCode in android/app/build.gradle.kts, and raise BYAK_MIN_VERSION_CODE after a successful upload."
            exit 1
          fi
          echo "versionCode $CODE > $MIN_VERSION_CODE: OK"

      - name: Verify the bundle is signed with the upload key
        env:
          BYAK_KEYSTORE_PASSWORD: ${{ secrets.BYAK_KEYSTORE_PASSWORD }}
          BYAK_KEY_ALIAS: ${{ secrets.BYAK_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.BYAK_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          AAB="${{ steps.build.outputs.aab_path }}"
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          unzip -q -o "$GITHUB_WORKSPACE/$AAB" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' || true
          SIG="$(ls META-INF/*.RSA META-INF/*.DSA META-INF/*.EC 2>/dev/null | head -1 || true)"
          if [ -z "$SIG" ]; then
            echo "::error::No JAR signature found in the bundle. Gradle did not sign it."
            exit 1
          fi
          openssl pkcs7 -inform DER -in "$SIG" -print_certs -outform PEM > signer.pem 2>/dev/null
          ACTUAL="$(openssl x509 -in signer.pem -noout -fingerprint -sha256 | sed 's/.*=//' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          echo "Bundle signer SHA-256: $ACTUAL"
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Bundle signed with $ACTUAL but the upload key is $EXPECTED. Google Play will reject this build."
              exit 1
            fi
            echo "Signer matches the pinned BYAK upload certificate."
          fi

      - name: Retain the signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: BYAK-AI-release-aab
          path: ${{ steps.build.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Upload to Google Play
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download the signed bundle
        uses: actions/download-artifact@v4
        with:
          name: BYAK-AI-release-aab
          path: dist

      - name: Write the Play publishing service account key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.BYAK_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Secret BYAK_PLAY_SERVICE_ACCOUNT_JSON is not set. Create a Google Cloud service account with Android Publisher access, grant it release access in Play Console, and store the JSON as this secret."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/byak"
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/byak/play-service-account.json"
          chmod 600 "$RUNNER_TEMP/byak/play-service-account.json"
          python3 -c "import json,sys; json.load(open(sys.argv[1])); print('service account JSON parses')" "$RUNNER_TEMP/byak/play-service-account.json"

      - name: Publish with fastlane supply
        env:
          JSON_KEY: ${{ runner.temp }}/byak/play-service-account.json
          CHANGES: ${{ inputs.changes }}
        run: |
          set -euo pipefail
          bundle exec fastlane android publish \
            --track "${{ inputs.track }}" \
            --rollout_fraction "${{ inputs.rollout_fraction }}" \
            --aab_path "$GITHUB_WORKSPACE/dist/app-release.aab" \
            --json_key "$JSON_KEY"
