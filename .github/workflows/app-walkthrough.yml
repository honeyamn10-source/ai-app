name: App walkthrough (emulator)

# Installs the debug app on an Android emulator and drives it like a person (AppWalkthroughTest):
# every screen, the Connect dialog, and a free chat. Uploads a screenshot per step, a report and logcat.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/app-walkthrough.yml'

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run the walkthrough on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c || true
            gradle -p android :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch walkthrough-failed
            mkdir -p walkthrough && adb pull /sdcard/Android/data/ai.byak.app.debug/files/walkthrough/. walkthrough/ || true
            adb logcat -d -v time > walkthrough/logcat.txt || true
            adb logcat -d -b crash -v time > walkthrough/crashes.txt || true
      - name: Report
        if: always()
        run: |
          cat walkthrough/report.txt 2>/dev/null || echo "no report.txt (test did not reach the end)"
          echo "---- crash buffer ----"; cat walkthrough/crashes.txt 2>/dev/null | head -80
          echo "---- app errors in logcat ----"; grep -E "AndroidRuntime|FATAL|ai\.byak" walkthrough/logcat.txt 2>/dev/null | grep -E " E/| F/|FATAL|Exception" | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-walkthrough
          path: |
            walkthrough/
            android/app/build/reports/androidTests/
          retention-days: 30
      - name: Fail if the walkthrough found problems
        if: always()
        run: test ! -f walkthrough-failed
