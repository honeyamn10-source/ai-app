name: BYAK CI
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node --check backend/src/server.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle -p android lintDebug testDebugUnitTest assembleDebug bundleRelease
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BYAK-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with: { path: '.', output-file: 'sbom.spdx.json' }
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, scan-ref: '.', severity: 'CRITICAL,HIGH', exit-code: '1' }
