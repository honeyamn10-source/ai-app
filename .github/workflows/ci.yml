name: BYAK CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Decode upload keystore (only when signing secrets are configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.BYAK_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/byak"
            printf '%s' "$KEYSTORE_B64" | tr -d '\n\r' | base64 --decode > "$RUNNER_TEMP/byak/upload.jks"
            chmod 600 "$RUNNER_TEMP/byak/upload.jks"
            echo "BYAK_KEYSTORE_FILE=$RUNNER_TEMP/byak/upload.jks" >> "$GITHUB_ENV"
            echo "decoded=true" >> "$GITHUB_OUTPUT"
          else
            echo "decoded=false" >> "$GITHUB_OUTPUT"
            echo "BYAK_UPLOAD_KEYSTORE_BASE64 is not set; building an unsigned release bundle."
          fi
      - name: Validate release signing
        if: steps.keystore.outputs.decoded == 'true'
        env:
          BYAK_KEYSTORE_PASSWORD: ${{ secrets.BYAK_KEYSTORE_PASSWORD }}
          BYAK_KEY_ALIAS: ${{ secrets.BYAK_KEY_ALIAS }}
          BYAK_KEY_PASSWORD: ${{ secrets.BYAK_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.BYAK_UPLOAD_CERT_SHA256 }}
        run: ./scripts/validate-release-signing.sh
      - run: gradle -p android lintDebug testDebugUnitTest assembleDebug bundleRelease
        env:
          BYAK_KEYSTORE_PASSWORD: ${{ secrets.BYAK_KEYSTORE_PASSWORD }}
          BYAK_KEY_ALIAS: ${{ secrets.BYAK_KEY_ALIAS }}
          BYAK_KEY_PASSWORD: ${{ secrets.BYAK_KEY_PASSWORD }}
          BYAK_GOOGLE_WEB_CLIENT_ID: ${{ vars.BYAK_GOOGLE_WEB_CLIENT_ID }}
          BYAK_SUPPORT_EMAIL: ${{ vars.BYAK_SUPPORT_EMAIL }}
          BYAK_PRIVACY_POLICY_URL: ${{ vars.BYAK_PRIVACY_POLICY_URL }}
          BYAK_TERMS_URL: ${{ vars.BYAK_TERMS_URL }}
      - name: Check native libraries support 16 KB pages (Google Play requirement)
        run: python3 scripts/check-16kb-alignment.py android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed Play bundle
        if: steps.keystore.outputs.decoded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BYAK-AI-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BYAK-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  legal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the legal pages
        run: |
          set -euo pipefail
          if python3 scripts/build-legal-pages.py --allow-placeholders; then :; fi
      - name: Warn if the policy is not ready to publish
        run: |
          set -euo pipefail
          if grep -q '\[\[' docs/legal/PRIVACY_POLICY.md docs/legal/TERMS.md; then
            echo "::warning title=Policy not publishable::docs/legal still has [[...]] operator placeholders. Google Play rejects a privacy policy with no operator name or address. Fill them in and re-run python3 scripts/build-legal-pages.py."
          fi
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with: { path: '.', output-file: 'sbom.spdx.json' }
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, scan-ref: '.', severity: 'CRITICAL,HIGH', exit-code: '1' }
